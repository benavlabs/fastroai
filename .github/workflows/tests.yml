name: Tests

on: [push, pull_request]

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.11

      - name: Install uv
        run: pip install uv

      - name: Install dependencies with lock file
        run: uv sync --locked --group dev

      - name: Run tests
        run: uv run --no-sync pytest
